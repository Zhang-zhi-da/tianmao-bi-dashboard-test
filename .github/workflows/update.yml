# 定时自动更新数据并发版（GitHub Pages 会自动用新数据重建看板）
# 用法：把 .github/workflows/update.yml 放进仓库，按需修改下方 cron 与“抓取数据”步骤。
name: update-data

on:
  schedule:
    # 每天北京时间 09:00 执行（UTC+8 → UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # ↓↓↓ 在这里接入你自己的数据源 ↓↓↓
      # 例：用 Node 脚本拉取最新业务数据并写入 data/sales.json
      # - name: 抓取最新数据
      #   run: node scripts/fetch_data.js
      # 或：用 curl 拉取一个 CSV/JSON 并转换
      # - name: 下载数据
      #   run: curl -s https://your-api.example.com/report.json -o data/sales.json
      # ↑↑↑ 接入点 ↑↑↑

      - name: 提交并推送（若有变化）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 自动更新数据'
          file_pattern: 'data/*.json'
